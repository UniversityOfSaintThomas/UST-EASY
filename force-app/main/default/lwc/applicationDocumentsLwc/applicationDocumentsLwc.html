<!-- Application Documents Lwc -->
<template>
    <template for:each={documentFilesDisplay} for:item="document">
        <div key={document.documentId} class="slds-p-bottom_small">
            <h3 class="slds-text-heading_small">{document.title}</h3>
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-p-around_none">
                    <button class="slds-button slds-button_neutral slds-p-around_none slds-m-right_small document-listing-button"
                            data-id={document.documentId}
                            data-clicktype="view"
                            onclick={documentHandler}>
                        View
                    </button>
                </div>
                <div class="slds-col slds-p-around_none">
                    <button class="slds-button slds-button_neutral slds-p-around_none document-listing-button"
                            data-id={document.documentId}
                            data-clicktype="download"
                            onclick={documentHandler}>
                        Download
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
