<!-- Application Documents Lwc -->
<template>
    <template for:each={documentFilesDisplay} for:item="document">
        <div key={document.documentId} class="slds-p-bottom_small">
            <p>{document.title}</p>
            <div class="slds-grid slds-wrap">
                <a href="#" onclick={documentHandler}
                   data-id={document.documentId}
                   data-clicktype="view"
                   class="slds-col slds-p-right_x-small">View</a>
                <a href="#" onclick={documentHandler}
                   data-id={document.documentId}
                   data-clicktype="download"
                   class="slds-col">Download</a>
            </div>
        </div>
    </template>
</template>
