<!-- App Review Nav -->
<template>
    <lightning-vertical-navigation onselect={handleMenuClick} selected-item={selectedNav}>
        <template lwc:if={items.length}>
            <lightning-vertical-navigation-section>
                <template for:each={items} for:item="item">
                    <lightning-vertical-navigation-item label={item.label} name={item.id} key={item.id}></lightning-vertical-navigation-item>
                </template>
            </lightning-vertical-navigation-section>
        </template>
    </lightning-vertical-navigation>
</template>
