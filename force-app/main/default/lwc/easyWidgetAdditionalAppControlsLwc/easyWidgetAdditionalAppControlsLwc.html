<!-- Easy Widget Additional App Controls Lwc -->
<template>
    <lightning-card>
        <h3 slot="title">
            <lightning-icon icon-name="utility:page" size="small" class="slds-p-right_x-small"></lightning-icon>
            Additional Application Controls
        </h3>
        <div class="slds-p-vertical_x-small slds-p-horizontal_medium">
            <lightning-dual-listbox name="languages"
                                    label="Select Controls"
                                    source-label={availableLabel}
                                    selected-label={selectedLabel}
                                    field-level-help="Select additional Application Controls for widget"
                                    options={applicationControlOptions}
                                    value={additionalApplicationControlValues}
                                    onchange={handleSelect}></lightning-dual-listbox>
        </div>
        <div class="slds-p-vertical_x-small slds-p-horizontal_medium">
            <p>Selected URL Parameters: {selectedText}</p>
        </div>
        <div class="slds-p-around_small">
            <lightning-button label="Save"
                              onclick={saveClick}
                              disabled={saveDisabled}
                              class="slds-p-right_x-small">
            </lightning-button>
            <lightning-button label="Cancel"
                              onclick={resetInitialValues}
                              disabled={cancelDisabled}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
