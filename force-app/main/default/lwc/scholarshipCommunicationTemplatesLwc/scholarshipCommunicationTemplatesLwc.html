<!-- Scholarship Communication Templates Lwc -->
<template>
    <lightning-card lwc:if={scholarshipEligibleCheck}>
        <h3 slot="title">
            <lightning-icon icon-name="utility:email" size="small" class="slds-p-right_x-small"></lightning-icon>
            Scholarship Communication Templates
        </h3>
        <div class="slds-p-vertical_x-small slds-p-horizontal_medium">
            <lightning-combobox
                    name="orgWideEmailSelect"
                    label="Sent From Email Address"
                    field-level-help="Sender of all communications to applicant."
                    value={templateDetails.orgWideEmail.select}
                    placeholder="Select..."
                    options={orgWideEmailValueOptions}
                    data-templatetype="orgWideEmail"
                    data-selecttype="orgWideEmail"
                    onchange={templateEventHandler}>
            </lightning-combobox>
            <!--            <p>Selected Org Wide Email Id value: {templateDetails.orgWideEmail.select}</p>-->
            <!--            <p>Initial Org Wide Email Id value: {templateDetails.orgWideEmail.initial}</p>-->
        </div>
        <div class="slds-p-vertical_x-small slds-p-horizontal_medium" lwc:if={startSelectVisible}>
            <lightning-combobox
                    name="startTemplateSelect"
                    label="Started Scholarship Email Template"
                    field-level-help="Started application confirmation email to applicant."
                    value={templateDetails.startTemplate.select}
                    placeholder="Select..."
                    options={startTemplateOptions}
                    data-templatetype="startTemplate"
                    data-selecttype="startTemplate"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input class="slds-p-vertical_xx-small"
                             type="checkbox"
                             label="Preview Template"
                             name="startTemplatePreview"
                             data-templatetype="startTemplate"
                             data-checktype="startTemplate"
                             disabled={startPreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <!--            <p>Selected Start Email Template value: {templateDetails.startTemplate.select}</p>-->
            <!--            <p>Initial Start Email Template Id: {templateDetails.startTemplate.initial}</p>-->
            <template lwc:if={previewCheckbox.start.clicked}>
                <p>
                    <lightning-formatted-rich-text value={startTemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>
        <div class="slds-p-vertical_x-small slds-p-horizontal_medium">
            <lightning-combobox
                    name="submitTemplateSelect"
                    label="Submitted Scholarship Email Template"
                    field-level-help="Submitted confirmation email to applicant."
                    value={templateDetails.submitTemplate.select}
                    placeholder="Select..."
                    options={submitTemplateOptions}
                    data-templatetype="submitTemplate"
                    data-selecttype="submitTemplate"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input class="slds-p-vertical_xx-small"
                             type="checkbox"
                             label="Preview Template"
                             name="submitTemplatePreview"
                             data-templatetype="submitTemplate"
                             data-checktype="submitTemplate"
                             disabled={submitPreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <!--            <p>Selected Submit Email Template value: {templateDetails.submitTemplate.select}</p>-->
            <!--            <p>Initial Submit Email Template Id: {templateDetails.submitTemplate.initial}</p>-->
            <template lwc:if={previewCheckbox.submit.clicked}>
                <p>
                    <lightning-formatted-rich-text value={submitTemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>
        <div class="slds-p-vertical_x-small slds-p-horizontal_medium" lwc:if={recommender1SelectVisible}>
            <lightning-combobox
                    name="recommender1TemplateSelect"
                    label="Recommender 1 Email Template"
                    field-level-help="Request email to Recommender 1"
                    value={templateDetails.recommender1Template.select}
                    placeholder="Select..."
                    options={recommender1TemplateOptions}
                    data-templatetype="recommender1Template"
                    data-selecttype="recommender1Template"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input class="slds-p-vertical_xx-small"
                             type="checkbox"
                             label="Preview Template"
                             name="recommender1TemplatePreview"
                             data-templatetype="recommender1Template"
                             data-checktype="recommender1Template"
                             disabled={recommender1PreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <!--            <p>Selected Recommender 1 Template value: {templateDetails.recommender1Template.select}</p>-->
            <!--            <p>Initial Recommender 1 Email Template Id: {templateDetails.recommender1Template.initial}</p>-->
            <template lwc:if={previewCheckbox.recommender1.clicked}>
                <p>
                    <lightning-formatted-rich-text value={recommender1TemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>
        <div class="slds-p-vertical_x-small slds-p-horizontal_medium" lwc:if={recommender2SelectVisible}>
            <lightning-combobox
                    name="recommender2TemplateSelect"
                    label="Recommender 2 Email Template"
                    field-level-help="Request email to Recommender 2"
                    value={templateDetails.recommender2Template.select}
                    placeholder="Select..."
                    options={recommender2TemplateOptions}
                    data-templatetype="recommender2Template"
                    data-selecttype="recommender2Template"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input class="slds-p-vertical_xx-small"
                             type="checkbox"
                             label="Preview Template"
                             name="recommender2TemplatePreview"
                             data-templatetype="recommender2Template"
                             data-checktype="recommender2Template"
                             disabled={recommender2PreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <!--            <p>Selected Recommender 2 Template value: {templateDetails.recommender2Template.select}</p>-->
            <!--            <p>Initial Recommender 2 Email Template Id: {templateDetails.recommender2Template.initial}</p>-->
            <template lwc:if={previewCheckbox.recommender2.clicked}>
                <p>
                    <lightning-formatted-rich-text value={recommender2TemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>
        <div class="slds-p-around_small">
            <lightning-button label="Save"
                              onclick={saveClick}
                              disabled={saveDisabled}
                              class="slds-p-right_x-small">
            </lightning-button>
            <lightning-button label="Cancel"
                              onclick={setInitialValues}
                              disabled={cancelDisabled}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
