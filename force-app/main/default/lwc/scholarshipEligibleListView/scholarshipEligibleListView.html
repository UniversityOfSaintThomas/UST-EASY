<!-- Scholarship Eligible List View -->
<template>
    <template lwc:if={isLoading}>
        <!-- Prevent flash of incorrect state while data is loading -->
    </template>
    <template lwc:elseif={hasError}>
        <div class="slds-p-bottom_x-small slds-text-color_error">{errorText}</div>
    </template>
    <template lwc:elseif={showScholarshipList}>
        <div class="scholarship_list_container">
            <template for:each={scholarshipLists} for:item="scholarship">
                <div key={scholarship.Id} class={widgetStyle}>
                    <div class="scholarship_row">
                        <span class="row_number">{scholarship.rowNumber}.</span>
                        <div class="scholarship_row_content">
                            <span>
                                <template lwc:if={scholarship.isStartedApp}>
                                    <a href={scholarship.DirectUrl} target=_blank title="Click to apply">{scholarship.Name}</a>
                                </template>
                                <template lwc:else>
                                    {scholarship.Name}
                                </template>
                                <span class="slds-m-left_xx-small app_status"><i>{scholarship.AppStatus}</i></span>
                            </span>
                            <template lwc:if={widgetDisplay}>
                                <div>
                                    <button type="button" class="button_styling" onclick={handleToggleDetails}
                                            data-id={scholarship.Id}>
                                        <span class={scholarship.chevronClass}></span>
                                        <span>{scholarship.buttonLabel}</span>
                                    </button>
                                </div>
                                <template lwc:if={scholarship.showDetails}>
                                    <div class="description_text">
                                        {scholarship.ShortDescription}
                                    </div>
                                </template>
                            </template>
                            <template lwc:else>
                                <div>
                                    {scholarship.ShortDescription}
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        <template lwc:if={showToggleAllButton}>
            <div class="toggle_all_container">
                <button type="button" class="button_styling" onclick={handleToggleAllDetails}>
                    <span>{toggleAllButtonLabel}</span>
                </button>
            </div>
        </template>
        <div class="scholarship_total_count">{totalScholarshipsText}</div>
    </template>
    <template lwc:else>
        <div class="slds-p-bottom_x-small">{noEligibleText}</div>
    </template>
</template>
