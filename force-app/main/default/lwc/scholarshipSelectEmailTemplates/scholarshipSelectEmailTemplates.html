<!-- Scholarship Selects Email Templates -->
<template>
    <lightning-card>
        <div class="slds-p-around_small">
            <lightning-combobox
                    name="orgWideEmailSelect"
                    label="Sent From Email Address"
                    value={orgWideEmailSelectId}
                    placeholder="Select From Email Address"
                    options={orgWideEmailValueOptions}
                    data-templatetype="orgWideEmail"
                    data-selecttype="orgWideEmail"
                    onchange={templateEventHandler}></lightning-combobox>
            <p>Selected Org Wide Email Id value: {orgWideEmailSelectId}</p>
            <p>Initial Org Wide Email Id value: {orgWideEmailInitialId}</p>
        </div>

        <div class="slds-p-around_small">
            <lightning-combobox
                    name="submitTemplateSelect"
                    label="Submitted Scholarship Email Template"
                    value={submitSelectTemplateId}
                    placeholder="Select Submitted Email Template"
                    options={emailTemplateValueOptions}
                    data-templatetype="submitTemplate"
                    data-selecttype="submitTemplate"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input type="checkbox"
                             label="Preview Email Template"
                             name="submitTemplatePreview"
                             data-templatetype="submitTemplate"
                             data-checktype="submitTemplate"
                             disabled={submitPreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <p>Selected Submit Email Template value: {submitSelectTemplateId}</p>
            <p>Initial Submit Email Template Id: {submitInitialTemplateId}</p>
            <template lwc:if={submitPreviewChecked}>
                <p>
                    <lightning-formatted-rich-text value={submitTemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>

        <div class="slds-p-around_small" lwc:if={startSelectVisible}>
            <lightning-combobox
                    name="startTemplateSelect"
                    label="Started Scholarship Email Template"
                    value={startSelectTemplateId}
                    placeholder="Select Started Email Template"
                    options={emailTemplateValueOptions}
                    data-templatetype="startTemplate"
                    data-selecttype="startTemplate"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input type="checkbox"
                             label="Preview Email Template"
                             name="startTemplatePreview"
                             data-templatetype="startTemplate"
                             data-checktype="startTemplate"
                             disabled={startPreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <p>Selected Start Email Template value: {startSelectTemplateId}</p>
            <p>Initial Start Email Template Id: {startInitialTemplateId}</p>
            <template lwc:if={startPreviewChecked}>
                <p>
                    <lightning-formatted-rich-text value={startTemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>

        <div class="slds-p-around_small" lwc:if={recommender1SelectVisible}>
            <lightning-combobox
                    name="recommender1TemplateSelect"
                    label="Recommender 1 Email Template"
                    value={recommender1SelectTemplateId}
                    placeholder="Select Recommender 1 Email Template"
                    options={emailTemplateValueOptions}
                    data-templatetype="recommender1Template"
                    data-selecttype="recommender1Template"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input type="checkbox"
                             label="Preview Email Template"
                             name="recommender1TemplatePreview"
                             data-templatetype="recommender1Template"
                             data-checktype="recommender1Template"
                             disabled={recommender1PreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <p>Selected Recommender 1 Template value: {recommender1SelectTemplateId}</p>
            <p>Initial Recommender 1 Email Template Id: {recommender1InitialTemplateId}</p>
            <template lwc:if={recommender1PreviewChecked}>
                <p>
                    <lightning-formatted-rich-text value={recommender1TemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>

        <div class="slds-p-around_small" lwc:if={recommender2SelectVisible}>
            <lightning-combobox
                    name="recommender2TemplateSelect"
                    label="Recommender 2 Email Template"
                    value={recommender2SelectTemplateId}
                    placeholder="Select Recommender 2 Email Template"
                    options={emailTemplateValueOptions}
                    data-templatetype="recommender2Template"
                    data-selecttype="recommender2Template"
                    onchange={templateEventHandler}></lightning-combobox>
            <lightning-input type="checkbox"
                             label="Preview Email Template"
                             name="recommender2TemplatePreview"
                             data-templatetype="recommender2Template"
                             data-checktype="recommender2Template"
                             disabled={recommender2PreviewDisabled}
                             onchange={templateEventHandler}>
            </lightning-input>
            <p>Selected Recommender 2 Template value: {recommender2SelectTemplateId}</p>
            <p>Initial Recommender 2 Email Template Id: {recommender2InitialTemplateId}</p>
            <template lwc:if={recommender2PreviewChecked}>
                <p>
                    <lightning-formatted-rich-text value={recommender2TemplateHtmlValue}></lightning-formatted-rich-text>
                </p>
            </template>
        </div>
        <div class="slds-p-around_small">
            <lightning-button label="Save"
                              onclick={saveClick}
                              disabled={saveDisabled}
                              class="slds-p-right_x-small">
            </lightning-button>
            <lightning-button label="Cancel"
                              onclick={setInitialValues}
                              disabled={cancelDisabled}>
            </lightning-button>
        </div>
        <template lwc:if={previewChecked}>
            <p>
                <lightning-formatted-rich-text value={templateHtmlValue}></lightning-formatted-rich-text>
            </p>
        </template>
    </lightning-card>
</template>
